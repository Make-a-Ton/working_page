<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="We are working on Make-A-Ton 9.0. View our past edition.">
    <title>Make-A-Ton 9.0</title>
    <link rel="icon" type="image/png" href="/assets/makeaton.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
        }

        .brain-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .brain-img {
            max-width: 180px;
            width: 100%;
            height: auto;
            filter: grayscale(100%) brightness(1.2) contrast(1.2);
            position: relative;
            z-index: 2;
        }

        /* Subtle glow behind brain */
        .brain-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        .title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0 0 2rem 0;
            line-height: 1.2;
            animation: fadeInUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .link-container {
            animation: fadeInUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.3s;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            padding-bottom: 6px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
            opacity: 0.8;
        }

        a svg {
            width: 18px;
            height: 18px;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        a:hover {
            color: #fff;
            opacity: 1;
        }

        a:hover svg {
            transform: translateX(4px) translateY(-4px);
        }

        a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: #fff;
            transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        a:hover::after {
            width: 100%;
        }

        /* Abstract geometric background lines */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .line {
            position: absolute;
            background: #fff;
        }
    </style>
</head>

<body>
    <div class="bg-lines" id="bg-lines"></div>

    <div class="container">
        <div class="brain-wrapper">
            <div class="brain-glow"></div>
            <img src="assets/makeaton%20brain.png" alt="Make-A-Ton Brain" class="brain-img">
        </div>

        <h1 class="title">Make-A-Ton 9.0<br />Coming Soon...</h1>

        <div class="link-container">
            <a href="https://2025.makeaton.in" target="_blank" rel="noopener noreferrer">
                View our past edition
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Generate abstract background lines for a subtle tech vibe
        const bgLines = document.getElementById('bg-lines');
        const numLines = 20;
        const styleSheet = document.createElement('style');
        document.head.appendChild(styleSheet);

        for (let i = 0; i < numLines; i++) {
            const line = document.createElement('div');
            line.classList.add('line');

            // Randomize position and size
            const isHorizontal = Math.random() > 0.5;

            if (isHorizontal) {
                line.style.width = `${Math.random() * 150 + 50}px`;
                line.style.height = '1px';
            } else {
                line.style.width = '1px';
                line.style.height = `${Math.random() * 150 + 50}px`;
            }

            line.style.left = `${Math.random() * 100}%`;
            line.style.top = `${Math.random() * 100}%`;

            const animationName = `fadeMove${i}`;
            const keyframes = `
                @keyframes ${animationName} {
                    0% { transform: translate(0, 0); opacity: 0; }
                    25% { opacity: ${Math.random() * 0.15 + 0.05}; }
                    50% { transform: translate(${Math.random() * 60 - 30}px, ${Math.random() * 60 - 30}px); opacity: 0; }
                    100% { transform: translate(0, 0); opacity: 0; }
                }
            `;
            styleSheet.sheet.insertRule(keyframes, styleSheet.sheet.cssRules.length);

            line.style.animation = `${animationName} ${Math.random() * 8 + 8}s linear infinite`;
            line.style.animationDelay = `-${Math.random() * 10}s`;
            line.style.opacity = 0;

            bgLines.appendChild(line);
        }
    </script>
</body>

</html>
